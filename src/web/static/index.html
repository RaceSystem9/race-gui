<link rel="stylesheet" href="/style.css" />
<style>
  /* 1. 브라우저 전체 스타일 강제 초기화 */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: auto !important;
    background-color: #0d0f12 !important;
    text-align: left !important;
  }

  /* 2. 최상단 컨테이너: 브라우저 좌측/상단에서 정확히 20px 위치에 absolute 고정 */
  #custom-master-container {
    position: absolute !important;
    top: 20px !important;
    left: 20px !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 600px !important; /* 버튼 박스의 전체 가로 너비 */
    box-sizing: border-box !important;
    text-align: left !important;
    z-index: 9999;
  }

  /* 3. 대형 타이틀 스타일 */
  .custom-main-title {
    font-size: 2.5rem !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.02em !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.3) !important;
    margin: 0 0 20px 0 !important;
    padding: 0 !important;
    white-space: nowrap !important;
    text-align: left !important;
    line-height: 1.2 !important;
  }

  /* 4. 버튼들을 감싸는 영역 (표 형태 상자 레이아웃 제거 및 좌측 밀착) */
  .custom-btn-group {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 5. 버튼 개별 스타일 (style.css 오버라이딩) */
  .custom-btn-group a {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 16px 24px !important;
    background: rgba(26, 29, 38, 0.85) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 12px !important;
    text-decoration: none !important;
    box-sizing: border-box !important;
    margin: 0 !important;
    width: 100% !important;
    float: none !important;
  }

  .custom-btn-group a:hover {
    background: rgba(40, 45, 58, 0.95) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
  }

  .custom-btn-group a strong {
    color: #ff6b00 !important; /* 요청하신 주황색 폰트 유지 */
    font-size: 1.25rem !important;
    font-weight: 700 !important;
  }

  .custom-btn-group a span {
    color: #a0a5b1 !important;
    font-size: 0.95rem !important;
  }
</style>
</head>
