<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>주행결과 - 레이스 방송 정보</title>
<link rel="stylesheet" href="/style.css" />
<style>
  /* =========================================================
     좌상단 앵커 고정 & 반응형 크기 변형 금지 (No-Scale Fixed Layout)
     ========================================================= */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: auto !important;
    background-color: #00FF00 !important;
  }

  /* 1920x1080 고정 컨테이너 (team-result.png 적용) */
  .fixed-viewport {
    position: absolute;
    top: -50px;
    left: -200px;
    width: 1920px;
    height: 1080px;
    min-width: 1920px;
    min-height: 1080px;
    background-image: url('plates/team-result.png');
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 1920px 1080px;
  }

  /* 상단 페이징 & 네비게이션 버튼 통합 컨트롤 바 */
  .page-control-bar {
    position: absolute;
    top: 70px;
    left: 210px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.85);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .page-btn, .nav-btn {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .nav-btn {
    background: #10b981;
  }

  .nav-btn:hover {
    background: #059669;
  }

  /* 활성화된 버튼 (주황색) */
  .nav-btn.active {
    background: #f59e0b;
  }

  .page-btn:disabled {
    background: #4b5563;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .page-indicator {
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    margin-right: 10px;
  }

  .nav-divider {
    width: 1px;
    height: 20px;
    background: rgba(255, 255, 255, 0.3);
    margin: 0 4px;
  }

  /* 주행결과 컨테이너 및 헤더 */
  .result-display-container {
    position: absolute;
    top: 235px;
    left: 410px;
    width: 1100px;
  }

  /* 상단 팀명 줄 */
  .result-header-title {
    text-align: center;
    font-family: "Gmarket Sans", sans-serif;
    font-weight: 700;
    font-size: 44px;
    color: #ffffff;
    margin-bottom: 60px;
    transform: translateY(-5px);
  }

  /* 주행결과 표 (구분선 제거) */
  .result-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .result-table tr {
    height: 69px;
  }

  /* 기본 셀 스타일 */
  .result-table td {
    font-family: "Pretendard", "Pretendard Local", sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: #ffffff;
    border: none !important;
    padding: 0;
    vertical-align: middle;
  }

  /* =========================================================
     [위치 조정 영역] transform: translateX() 속성으로 위치 조절
     ========================================================= */
  
  /* 1. 미션 항목 열 위치 조정 */
  .result-table td.col-mission {
    width: 50%;
    text-align: center;
    transform: translateX(-10px);
  }

  /* 2. 벌초 점수 열 위치 조정 */
  .result-table td.col-score {
    width: 50%;
    text-align: center;
    transform: translateX(30px);
  }

  /* 맨 아래 최종합계시간 */
  .result-table tr.total-row td {
    font-family: "Pretendard", "Pretendard Local", sans-serif;
    font-weight: 900;
    font-size: 32px;
    color: #ff9900;
    transform: translateY(-10px); 
  }

  /* 3. 최종합계시간 위치 (좌우 & 상하 통합 조정) */
  .result-table tr.total-row td.col-mission {
    transform: translate(-10px, -5px);
  }
  .result-table tr.total-row td.col-score {
    transform: translate(20px, -5px);
  }
  
</style>
</head>
<body class="broadcast-page">

<div class="fixed-viewport">
  <!-- 상단 컨트롤 바 (팀 페이징 + 주요 페이지 5개 바로가기) -->
  <div class="page-control-bar">
    <!-- 팀 전환 컨트롤 (버튼 비활성화 없음) -->
    <button id="prevBtn" class="page-btn" onclick="changeTeam(-1)">이전팀</button>
    <span id="pageIndicator" class="page-indicator">팀 1 / 1</span>
    <button id="nextBtn" class="page-btn" onclick="changeTeam(1)">다음팀</button>

    <!-- 구분선 -->
    <div class="nav-divider"></div>

    <!-- 5개 주요 페이지 바로가기 버튼 (1차 주행내용에 active 지정) -->
    <a href="/teams.html" class="nav-btn">주행 순서</a>
    <a href="/team-result1.html" class="nav-btn active">1차 주행내용</a>
    <a href="/team-result2.html" class="nav-btn">2차 주행내용</a>
    <a href="/leaderboard-round1.html" class="nav-btn">1차 순위표</a>
    <a href="/leaderboard-round2.html" class="nav-btn">2차 순위표</a>
    <a href="/leaderboard-final.html" class="nav-btn">최종 순위표</a>
  </div>

  <!-- 이미지 위 팀 주행결과 표시 영역 -->
  <div class="result-display-container">
    <div id="headerTitle" class="result-header-title">- - 1차 주행 결과</div>

    <table class="result-table">
      <tbody>
        <tr>
          <td class="col-mission">신호등 인식 출발</td>
          <td id="m1" class="col-score">-</td>
        </tr>
        <tr>
          <td class="col-mission">라바콘 주행</td>
          <td id="m2" class="col-score">-</td>
        </tr>
        <tr>
          <td class="col-mission">고정 장애물 회피</td>
          <td id="m3" class="col-score">-</td>
        </tr>
        <tr>
          <td class="col-mission">방해 차량 추월</td>
          <td id="m4" class="col-score">-</td>
        </tr>
        <tr>
          <td class="col-mission">차선인식 주행</td>
          <td id="m5" class="col-score">-</td>
        </tr>
        <tr>
          <td class="col-mission">주행 시간</td>
          <td id="mTime" class="col-score">-</td>
        </tr>
        <tr class="total-row">
          <td class="col-mission">최종 합계 시간</td>
          <td id="mTotal" class="col-score">-</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/app.js"></script>
<script>
  let currentTeamIndex = 0;
  let cachedTeams = [];
  let raceResults = {};
  let currentRoundTitle = "1차";

  const MISSION_KEYS = [
    "lblMIssionScore1",
    "lblMIssionScore2",
    "lblMIssionScore3",
    "lblMIssionScore4",
    "lblMIssionScore5"
  ];

  function formatTimeValue(val) {
    if (val === undefined || val === null) return "0.000";
    const num = Number(val);
    return isNaN(num) ? "0.000" : num.toFixed(3);
  }

  function renderTeamResult() {
    const totalTeams = cachedTeams.length;
    if (totalTeams === 0) {
      document.getElementById("headerTitle").textContent = `- - 1차 주행 결과`;
      document.getElementById("pageIndicator").innerText = "팀 0 / 0";
      return;
    }

    // 순환 인덱스 계산 (양수/음수 범위 무한 순환)
    currentTeamIndex = ((currentTeamIndex % totalTeams) + totalTeams) % totalTeams;

    const currentTeam = cachedTeams[currentTeamIndex] || {};
    
    // 팀 식별 ID 추출
    const teamId = currentTeam.team_number || currentTeam.number || currentTeam.team_id || currentTeam.id;
    
    // 팀명 탐색
    const teamName = currentTeam.team_name || 
                     currentTeam.name || 
                     currentTeam.team || 
                     currentTeam.title || 
                     (teamId ? `팀 ${teamId}` : "-");

    // 상단 타이틀 표시
    document.getElementById("headerTitle").textContent = `${teamName} - 1차 주행 결과`;

    // 1차 주행 결과 데이터 가져오기
    const res = raceResults[teamId] || currentTeam.result || currentTeam || {};
    const scores = res.mission_scores || res.scores || {};

    // 1~5번 미션 점수 매핑
    MISSION_KEYS.forEach((key, idx) => {
      const el = document.getElementById(`m${idx + 1}`);
      if (el) {
        const val = scores[key] ?? res[key];
        el.textContent = formatTimeValue(val);
      }
    });

    // 주행 시간 및 최종 시간
    document.getElementById("mTime").textContent = formatTimeValue(res.elapsed_time);
    document.getElementById("mTotal").textContent = formatTimeValue(res.final_time);

    // 컨트롤 바 상태 업데이트 (버튼 비활성화 해제 유지)
    document.getElementById("pageIndicator").innerText = `팀 ${currentTeamIndex + 1} / ${totalTeams}`;
    document.getElementById("prevBtn").disabled = false;
    document.getElementById("nextBtn").disabled = false;
  }

  function changeTeam(direction) {
    currentTeamIndex += direction;
    renderTeamResult();
  }

  startBroadcastPolling((data) => {
    currentRoundTitle = "1차";
    raceResults = {};
    cachedTeams = [];

    if (Array.isArray(data)) {
      // 1. data가 배열일 경우 (1차 데이터 필터링)
      const r1Items = data.filter(item => item && Number(item.round_no) === 1);
      
      r1Items.forEach(item => {
        const tNum = item.team_number || item.number || item.team_id || item.id;
        if (tNum) {
          raceResults[tNum] = item;
          cachedTeams.push(item);
        }
      });
    } else if (data && typeof data === 'object') {
      // 2. data가 객체일 경우 ({ teams: [...], race_results: [...] })
      const rawTeams = data.teams || [];
      const rawResults = data.race_results || [];

      // 1차 주행 결과 매핑
      rawResults.forEach(item => {
        if (item && Number(item.round_no) === 1) {
          const tNum = item.team_number || item.number || item.team_id || item.id;
          if (tNum) raceResults[tNum] = item;
        }
      });

      // 팀 정보 목록 설정
      if (rawTeams.length > 0) {
        cachedTeams = rawTeams;
      } else if (Object.keys(raceResults).length > 0) {
        cachedTeams = Object.values(raceResults);
      }
    }

    // 팀 번호 오름차순 정렬
    cachedTeams.sort((a, b) => {
      const numA = a.team_number || a.number || a.team_id || a.id || 0;
      const numB = b.team_number || b.number || b.team_id || b.id || 0;
      return numA - numB;
    });

    renderTeamResult();
  });
</script>
</body>
</html>
