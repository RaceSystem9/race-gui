<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Replay - Race Control</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="replay-page">
  <main class="replay-overlay" aria-label="Replay overlay">
    <div class="replay-label">REPLAY</div>
    <div id="replayTeam" class="replay-team">-</div>
  </main>
<script src="/app.js"></script>
<script>
  startBroadcastPolling((data) => {
    const team = data.team || {};
    document.getElementById("replayTeam").textContent = team.name || "-";
  });
</script>
</body>
</html>
