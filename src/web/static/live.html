<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 경주 - 레이스 방송 정보</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="broadcast-page plate-page plate-team-result">
<nav class="topnav">
  <a href="/index.html">홈</a>
  <a href="/live.html" class="active">실시간 경주</a>
  <a href="/leaderboard.html">순위표</a>
  <a href="/teams.html">참가팀</a>
  <a href="/teams-2.html">주행 순서 2</a>
  <a href="/teams-3.html">주행 순서 3</a>
  <a href="/info.html">안내</a>
  <span id="connStatus" class="conn-status">연결 확인 중...</span>
</nav>
<main class="broadcast-main">
  <section class="broadcast-panel">
    <div class="neon-line"></div>
    <header class="broadcast-heading">
      <span class="brand-mark">KMU <b>국민대학교</b></span>
      <h1 id="roundTitle">1차 주행 결과</h1>
      <span class="event-mark">◆ 자이트론</span>
    </header>
    <div class="mission-title"><span>미션 항목</span><span>벌초</span></div>
    <div id="missionRows"></div>
    <div class="mission-total"><span>최종 합계 시간</span><strong id="finalTime">-</strong></div>
    <div class="neon-line"></div>
  </section>
  <section class="broadcast-overlay">
    <div id="timer" class="overlay-time">-</div>
    <div id="teamTitle" class="overlay-team">-</div>
    <div id="teamSub" hidden></div>
  </section>
</main>
<script src="/app.js"></script>
<script>
  const MISSION_LABELS = {
    lblMIssionScore1: "신호등",
    lblMIssionScore2: "라바콘",
    lblMIssionScore3: "차선",
    lblMIssionScore4: "미션4",
    lblMIssionScore5: "미션5",
  };

  startBroadcastPolling((data) => {
    document.getElementById("roundTitle").textContent = `${data.view_mode_title || "1차"} 주행 결과`;

    const team = data.team || {};
    document.getElementById("teamTitle").textContent = team.name ?? "-";
    document.getElementById("teamSub").textContent = `${team.school ?? "-"} · 상태 ${data.status ?? "-"}`;

    const timerEl = document.getElementById("timer");
    if (data.status === "COUNTDOWN") {
      timerEl.textContent = `- ${Math.max(0, Number(data.countdown ?? 0))}`;
      timerEl.classList.add("countdown");
    } else {
      const shownTime = data.final_time ?? data.official_elapsed_time ?? data.elapsed_time;
      timerEl.textContent = formatSeconds(shownTime);
      timerEl.classList.remove("countdown");
    }

    const scores = data.mission_scores || {};
    const scoreHtml = Object.entries(MISSION_LABELS)
      .map(([key, label]) => `<div class="mission-row"><span>${label}</span><strong>${escapeHtml(scores[key] ?? 0)}</strong></div>`)
      .join("");
    document.getElementById("missionRows").innerHTML = scoreHtml;

    document.getElementById("finalTime").textContent = formatSeconds(data.final_time);
  });
</script>
</body>
</html>
