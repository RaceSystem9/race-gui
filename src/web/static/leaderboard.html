<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>순위표 - 레이스 방송 정보</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="broadcast-page plate-page plate-round1">
<nav class="topnav">
  <a href="/index.html">홈</a>
  <a href="/live.html">실시간 경주</a>
  <a href="/leaderboard.html" class="active">순위표</a>
  <a href="/teams.html">참가팀</a>
  <a href="/teams-2.html">주행 순서 2</a>
  <a href="/teams-3.html">주행 순서 3</a>
  <a href="/info.html">안내</a>
  <span id="connStatus" class="conn-status">연결 확인 중...</span>
</nav>
<main class="broadcast-main">
  <section class="broadcast-panel ranking-panel">
    <div class="neon-line"></div>
    <header class="broadcast-heading">
      <span class="brand-mark">KMU <b>국민대학교</b></span>
      <h1 id="rankingTitle">경기 결과</h1>
      <span class="event-mark">◆ 자이트론</span>
    </header>
  <div class="tabs">
    <button data-mode="ROUND1" class="active">1차</button>
    <button data-mode="ROUND2">2차</button>
    <button data-mode="FINAL">최종</button>
  </div>

  <table class="leaderboard broadcast-table">
    <thead>
      <tr><th class="rank">주행 순서</th><th>소속</th><th>팀명</th><th class="time">총 주행 시간</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  </section>
</main>
<script src="/app.js"></script>
<script>
  let currentMode = "ROUND1";
  let latestData = null;

  function renderRows() {
    const tbody = document.getElementById("rows");
    if (!latestData) return;
    const rows = (latestData.leaderboards && latestData.leaderboards[currentMode]) || [];
    tbody.innerHTML = rows
      .map((row, index) => {
        if (!row || row.team_name === "-") return "";
        const isGiveup = Boolean(row.giveup);
        const isDisqualified = Boolean(row.disqualified);
        let timeText;
        if (isGiveup) {
          timeText = "포기";
        } else if (isDisqualified || row.final_time === null || row.final_time === undefined) {
          timeText = "실격";
        } else {
          timeText = formatSeconds(row.final_time);
        }
        const rowClass = isGiveup || isDisqualified ? "giveup" : "";
        const rankClass = index < 3 ? "top-rank" : "regular-rank";
        return `<tr class="${rowClass} ${rankClass}">
          <td class="rank">${index + 1}</td>
          <td>${escapeHtml(row.school)}</td>
          <td>${escapeHtml(row.team_name)}</td>
          <td class="time">${timeText}</td>
        </tr>`;
      })
      .join("");
  }

  document.querySelectorAll(".tabs button").forEach((button) => {
    button.addEventListener("click", () => {
      currentMode = button.dataset.mode;
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      button.classList.add("active");
      renderRows();
    });
  });

  startBroadcastPolling((data) => {
    latestData = data;
    currentMode = data.view_mode || currentMode;
    document.body.classList.toggle("plate-final", currentMode === "FINAL");
    document.body.classList.toggle("plate-round1", currentMode !== "FINAL");
    document.getElementById("rankingTitle").textContent = currentMode === "FINAL" ? "최종 경기 결과" : `${data.view_mode_title || "1차"} 경기 결과`;
    renderRows();
  });
</script>
</body>
</html>
