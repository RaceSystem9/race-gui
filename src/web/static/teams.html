<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>참가팀 - 레이스 방송 정보</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="broadcast-page plate-page plate-order">
<nav class="topnav">
  <a href="/index.html">홈</a>
  <a href="/live.html">실시간 경주</a>
  <a href="/leaderboard.html">순위표</a>
  <a href="/teams.html" class="active">참가팀</a>
  <a href="/teams-2.html">주행 순서 2</a>
  <a href="/teams-3.html">주행 순서 3</a>
  <a href="/info.html">안내</a>
  <span id="connStatus" class="conn-status">연결 확인 중...</span>
</nav>
<main class="broadcast-main">
  <section class="broadcast-panel ranking-panel">
    <div class="neon-line"></div>
    <header class="broadcast-heading">
      <span class="brand-mark">KMU <b>국민대학교</b></span>
      <h1>주행 순서</h1>
      <span class="event-mark">◆ 자이트론</span>
    </header>
  <table class="leaderboard broadcast-table order-table">
    <thead>
      <tr><th class="rank">주행 순서</th><th>소속</th><th>팀명</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </section>
</main>
<script src="/app.js"></script>
<script>
  function progressPill(done, label) {
    const cls = done ? "done" : "pending";
    return `<span class="progress-pill ${cls}">${label} ${done ? "완료" : "미완료"}</span>`;
  }

  startBroadcastPolling((data) => {
    const teams = data.teams || [];
    const progressMap = data.team_progress || {};
    const tbody = document.getElementById("rows");
    tbody.innerHTML = teams.slice(0, 8)
      .map((team) => {
        const info = progressMap[String(team.number)] || {};
        const status = team.giveup
          ? '<span class="progress-pill">포기</span>'
          : progressPill(info.round1_done, "1차") +
            progressPill(info.round2_done, "2차") +
            progressPill(info.final_confirmed, "최종 확정");
        return `<tr>
          <td class="rank">${team.number}</td>
          <td>${escapeHtml(team.school)}</td>
          <td>${escapeHtml(team.team_name)}</td>
        </tr>`;
      })
      .join("");
  });
</script>
</body>
</html>
